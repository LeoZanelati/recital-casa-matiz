:root{--ink:#0b0908;--ink2:#15100c;--velvet:#6f1520;--gold:#ffb000;--champ:#ebd3a2;--smoke:#b9ad9a;--line:rgba(235,211,162,.16)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:68px}
body{background:var(--ink);color:#fff;font-family:"Archivo",system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.cz{font-family:"Cinzel",serif;font-weight:900;color:var(--champ);text-shadow:0 2px 0 #8a6a2c,0 6px 24px rgba(0,0,0,.55)}

/* ---- hero ---- */
.hero{position:relative;overflow:hidden;padding:36px 0 34px;background:
  radial-gradient(ellipse 90% 60% at 50% 0%,#33241a,transparent 70%),var(--ink)}
.hero::before,.hero::after{content:"";position:absolute;top:-10%;width:520px;height:900px;transform-origin:50% 0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,226,160,.30),rgba(255,226,160,.03) 60%,transparent);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);filter:blur(10px)}
.hero::before{left:-260px;transform:rotate(-34deg)}
.hero::after{right:-260px;transform:rotate(34deg)}
.curt{position:absolute;top:0;bottom:0;width:70px;opacity:.5;pointer-events:none;background:repeating-linear-gradient(90deg,#2b070c 0 10px,#6f1520 20px,#2b070c 30px)}
.curt.l{left:0;-webkit-mask-image:linear-gradient(90deg,#000,transparent);mask-image:linear-gradient(90deg,#000,transparent)}
.curt.r{right:0;-webkit-mask-image:linear-gradient(270deg,#000,transparent);mask-image:linear-gradient(270deg,#000,transparent)}
.hero .wrap{position:relative;z-index:1}
.brand{display:flex;align-items:center;justify-content:space-between}
.brand img{height:72px;display:block}
.sign{position:relative;text-align:center;padding:9px 16px 7px;border-radius:10px;background:linear-gradient(180deg,#7d1824,#4a0c14);border:2px solid #b8862a;
  box-shadow:0 0 0 2px #2b070c,0 8px 22px rgba(0,0,0,.6),0 0 26px rgba(255,176,0,.28)}
.sign::before{content:"";position:absolute;inset:4px;border-radius:7px;border:3px dotted #ffd36a;pointer-events:none;animation:blk 1.6s steps(1) infinite}
.sign small{display:block;font-size:10px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:#ffd36a;padding-top:4px}
.sign span{display:block;font-family:"Cinzel",serif;font-weight:900;font-size:clamp(19px,6vw,26px);line-height:1.15;letter-spacing:.1em;padding:1px 0 4px .1em;color:#fff3c9;text-shadow:0 0 12px rgba(255,200,80,.85),0 2px 0 #8a6a2c}
@keyframes blk{50%{opacity:.35}}
.pre{margin-top:46px;font-size:17px;color:var(--smoke)}
h1.cz{font-size:clamp(46px,15vw,76px);line-height:1;margin-top:10px;letter-spacing:.005em}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:22px;font-size:15px;font-weight:500;color:var(--smoke)}
.meta b{color:#fff;font-weight:600}
.rate{display:inline-grid;place-items:center;width:24px;height:24px;border:1.5px solid var(--smoke);border-radius:4px;font-size:14px;font-weight:700}
.date{margin-top:26px;font-size:20px;font-weight:600;font-stretch:92%;line-height:1.25}
.date small{display:block;font-size:16px;font-weight:400;color:var(--champ);margin-top:2px}
.bulbs{display:flex;justify-content:space-between;margin:0 -2px 26px}
.bulbs i{width:9px;height:9px;border-radius:50%;background:#ffd36a;box-shadow:0 0 10px 2px rgba(255,176,0,.65);animation:bl 1.6s steps(1) infinite}
.bulbs i:nth-child(even){animation-delay:.8s}
@keyframes bl{50%{opacity:.25;box-shadow:none}}
.aviso{display:flex;gap:14px;align-items:center;margin-top:26px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04);font-size:15px;color:var(--champ);line-height:1.3}
.aviso svg{flex:none;width:30px;height:30px;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.aviso b{display:block;color:#fff;font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}

/* ---- abas de sessão ---- */
.tabs{position:sticky;top:0;z-index:20;background:rgba(11,9,8,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:8px;padding-top:10px;padding-bottom:10px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:1 1 0;min-width:0;text-align:center;padding:8px 6px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--smoke);
  font:inherit;font-size:14px;font-weight:600;cursor:pointer;line-height:1.15;white-space:nowrap}
.tab small{display:block;font-size:13px;font-weight:400}
.tab[aria-selected="true"]{background:var(--gold);border-color:var(--gold);color:#1a1100}
.tab[aria-selected="true"] small{color:#3a2900}

/* ---- lista ---- */
.sess{padding:30px 0 10px}
.sess[hidden]{display:none}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;padding:16px 18px;border-radius:14px;border:1.5px dashed rgba(255,176,0,.45);background:linear-gradient(90deg,rgba(255,176,0,.10),rgba(111,21,32,.18))}
.sh h2{font-size:30px;font-weight:800;font-stretch:82%;letter-spacing:-.005em}
.sh p{font-size:15px;color:var(--smoke);text-align:right}
.sh p b{color:var(--gold);font-weight:700}
ol{list-style:none}
.row{display:grid;grid-template-columns:38px 1fr 26px;gap:0 12px;align-items:start;padding:15px 0;border-top:1px solid var(--line)}
.n{font-size:26px;font-weight:300;font-stretch:75%;color:var(--gold);line-height:1.05;text-align:right}
.n small{display:block;font-size:9px;letter-spacing:.14em;font-weight:600;font-stretch:100%;color:var(--smoke);text-transform:uppercase;margin-top:2px}
.who{font-size:18px;font-weight:700;font-stretch:90%;line-height:1.2}
.pc{font-size:16px;color:var(--champ);margin-top:2px;line-height:1.25}
.sub{font-size:14px;color:var(--smoke);margin-top:2px;line-height:1.3}
.ic{width:22px;height:22px;stroke:var(--smoke);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.row.sp{background:linear-gradient(90deg,rgba(255,176,0,.07),transparent 70%);margin:0 -20px;padding-left:20px;padding-right:20px}
.row.sp .n{display:grid;place-items:center;text-align:center}
.row.sp img{width:38px;height:38px;border-radius:50%;display:block}
.row.sp .who{color:var(--champ)}

/* ---- professoras / local / apoio ---- */
.wrap.sec{padding:44px 20px 6px;margin-top:30px;border-top:1px solid var(--line)}
.sec h2{font-size:30px;font-weight:800;font-stretch:82%}
.band{display:flex;gap:18px;align-items:center;margin-top:18px}
.band img{width:96px;height:96px;border-radius:50%;flex:none;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.band p{font-size:16px;color:var(--smoke)}
.band p b{display:block;font-family:"Cinzel",serif;font-weight:900;font-size:26px;color:var(--champ);margin-bottom:2px}
.prof{margin-top:20px}
.prof li{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line);font-size:17px;font-weight:600;font-stretch:92%}
.prof li span{font-weight:400;color:var(--smoke);text-align:right;font-size:15px}
.venue{margin-top:16px;font-size:17px;line-height:1.4}
.venue b{display:block;font-size:19px}
.venue span{color:var(--smoke);font-size:15px;display:block;margin-top:6px}
.sec .kick{font-size:15px;color:var(--smoke);margin-top:4px}
.fimsess{margin-top:6px;padding:22px 0 6px;border-top:1px solid var(--line);text-align:center}
.fimsess b{font-family:"Cinzel",serif;font-weight:900;font-size:34px;color:var(--champ);letter-spacing:.06em;display:block;text-shadow:0 2px 0 #8a6a2c}
.fimsess span{display:block;margin-top:6px;font-size:15px;color:var(--smoke)}
.cred{display:grid;grid-template-columns:1fr 1px 1fr;gap:0 18px;align-items:center;padding:44px 0 26px;margin-top:40px;border-top:1px solid var(--line);text-align:center}
.cred div{display:flex;flex-direction:column;align-items:center;gap:12px}
.cred span{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--smoke)}
.cred .vl{width:1px;height:80px;background:var(--line);display:block}
.cred img{height:76px;width:auto;max-width:100%;object-fit:contain}.cred img.op{width:132px}
.ig{display:block;text-align:center;margin:6px 0 18px;font-size:15px;color:var(--champ);text-decoration:none}
.ig b{color:#fff}
.foot{font-size:13px;color:var(--smoke);text-align:center;padding-bottom:30px}
@media (min-width:700px){body{font-size:17px}.hero{padding-top:56px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.sign::before{animation:none}}
</style>
</head>

function parseCSV(t){
  const rows=[]; let row=[], f='', q=false;
  t=t.replace(/^﻿/,'');
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++} else q=false } else f+=c }

  }
  if(f!==''||row.length){ row.push(f); rows.push(row) }
  return rows;
}
const hhmm = s => { s=String(s||'').trim(); const m=s.match(/^(\d{1,2}):(\d{2})/); return m? m[1].padStart(2,'0')+':'+m[2] : '' };
const toSec = s => { s=String(s||'').replace(/'/g,'').trim(); if(!s) return null; const p=s.split(':').map(Number); if(p.some(isNaN)) return null;
  return p.length===2 ? p[0]*60+p[1] : p.length===3 ? p[0]*3600+p[1]*60+p[2] : p[0]; };
const ytId = l => { const m=String(l||'').match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m?m[1]:'' };

/* aba "Telão" -> linhas  (colunas localizadas pelo NOME do cabeçalho) */
function parseTelao(csv){
  const t=parseCSV(csv); if(t.length<2) return null;
  const H=t[0].map(h=>h.trim().toUpperCase());
  const ix=n=>H.findIndex(h=>h.startsWith(n));
  const c={sessao:ix('SESSÃO'),tipo:ix('TIPO'),ordem:ix('ORDEM'),aluno:ix('ALUNO'),prog:ix('NOME NO PROGRAMA'),prof:ix('PROFESSORA'),instr:ix('INSTRUMENTO'),
    peca:ix('PEÇA'),comp:ix('COMPOSITOR'),filme:ix('FILME'),link:ix('LINK'),ini:ix('INÍCIO'),fim:ix('FIM'),arq:ix('ARQUIVO'),fundo:ix('FUNDO'),status:ix('STATUS')};
  if(c.sessao<0||c.tipo<0||c.ordem<0||c.aluno<0||c.peca<0) return null;
  const g=(r,k)=>c[k]>=0?String(r[c[k]]||'').trim():'';
  const out=[];
  for(const r of t.slice(1)){
    const s=g(r,'sessao').toUpperCase(), tipo=g(r,'tipo');
    if(!s||!tipo) continue;
    out.push({sessao:s,tipo,ordem:parseInt(g(r,'ordem'))||0,aluno:g(r,'aluno'),prog:g(r,'prog')||g(r,'aluno'),prof:g(r,'prof'),instr:g(r,'instr'),
      peca:g(r,'peca'),comp:g(r,'comp'),filme:g(r,'filme'),yt:ytId(g(r,'link')),ini:toSec(g(r,'ini')),fim:toSec(g(r,'fim')),arq:g(r,'arq'),
      bg:/infantil/i.test(g(r,'fundo'))?'infantil':'cinema',status:g(r,'status')});
  }
  return out.length?out:null;
}

/* aba "Config Telão" -> cfg  (linhas localizadas pelo RÓTULO da coluna A) */
function parseConfig(csv, base){
  const t=parseCSV(csv); if(t.length<2) return null;
  const cfg=JSON.parse(JSON.stringify(base)); const L={};
  let mode='', sess={}, banda=[];
  for(const r of t.slice(1)){
    const a=String(r[0]||'').trim(), b=String(r[1]||'').trim(), c2=String(r[2]||'').trim(), d=String(r[3]||'').trim();
    if(!a) continue;
    const u=a.toUpperCase();
    if(u.startsWith('SESSÃO')){ mode='s'; continue }
    if(u.startsWith('INTEGRANTES')){ mode='b'; continue }
    if(u.startsWith('ATENÇÃO')){ mode=''; continue }
    if(mode==='s' && /^[A-Z]$/.test(u)){ sess[u]={ini:hhmm(b),fim:hhmm(c2),n:parseInt(d)||0}; continue }
    if(mode==='b'){ banda.push({n:a,i:b}); continue }
    if(mode==='s') mode='';
    L[u]=b;
  }
  const set=(k,v)=>{ if(v) cfg[k]=v };
  set('titulo',L['EVENTO']); set('tema',L['TEMA']); set('local',L['LOCAL']); set('endereco',L['ENDEREÇO']);
  set('maps',L['LINK GOOGLE MAPS']); set('waze',L['LINK WAZE']); set('instagram',L['INSTAGRAM']); set('entrada',L['ENTRADA']);
  if(L['DATA']&&/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(L['DATA'])) cfg.data=L['DATA'];
  const [dd,mm,yy]=cfg.data.split('/').map(Number); const dt=new Date(yy,mm-1,dd);
  cfg.dataExtenso=`${DIAS[dt.getDay()]}, ${dd} de ${MESES[mm-1]} de ${yy}`;
  if(Object.keys(sess).length) cfg.sessoes=sess;
  if(banda.length) cfg.banda=banda;
  return cfg;
}

function loadCached(snap){
  try{ const c=JSON.parse(localStorage.getItem(SYNC_KEY)||'null'); if(c && c.cfg && c.rows && c.rows.length+1 && c.cfg.built>snap.cfg.built && c.cfg.sessoes) return c }catch(e){}
  return snap;
}
const SYNC_STATE={ok:null,when:null,err:'',tel:0,cfg:0,tries:0};
async function fetchCSV(url){
  const u=url+(url.includes('?')?'&':'?')+'_='+Date.now();
  const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),12000);
  try{ const r=await fetch(u,{cache:'no-store',signal:ctl.signal}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.text() }
  finally{ clearTimeout(tm) }
}
/* devolve novo DATA (ou null se nada mudou/falhou). need: 'config' | 'both' */
async function syncNow(cur, need){
  SYNC_STATE.tries++;
  if(!SYNC.config || (need==='both' && !SYNC.telao)){ SYNC_STATE.ok=null; SYNC_STATE.err='links de publicação não configurados'; return null }
  try{
    const [cfgTxt, telTxt] = await Promise.all([fetchCSV(SYNC.config), need==='both'?fetchCSV(SYNC.telao):Promise.resolve(null)]);
    const cfg=parseConfig(cfgTxt,cur.cfg); if(!cfg) throw new Error('aba Config ilegível');
    let rows=cur.rows;
    if(telTxt!==null){ rows=parseTelao(telTxt); if(!rows) throw new Error('aba Telão ilegível'); }
    cfg.built=new Date().toISOString();
    SYNC_STATE.ok=true; SYNC_STATE.err=''; SYNC_STATE.when=new Date(); SYNC_STATE.cfg=1; SYNC_STATE.tel=rows.length;
    const next={cfg,rows};
    try{ localStorage.setItem(SYNC_KEY,JSON.stringify(next)) }catch(e){}
    return next;
  }catch(e){
    SYNC_STATE.ok=false; SYNC_STATE.err=String(e&&e.message||e); return null;
  }
}

function render(){
  const C=DATA.cfg; sessions=Object.keys(C.sessoes);
  const total = DATA.rows.filter(perf).length;
  $('titulo').innerHTML = esc(C.titulo).replace(/,\s*/g,',<br>');
  $('meta').innerHTML = `<b>2026</b><span class="rate" title="Livre">L</span><span>${sessions.length} sessões</span><span>${total} apresentações</span><span>${esc(C.entrada)}</span>`;
  $('data').innerHTML = `${esc(C.dataExtenso.replace(/^./,c=>c.toUpperCase()))}<small>${esc(C.local)}</small>`;
  $('venue').innerHTML = `<b>${esc(C.local)}</b><span>${esc(C.endereco)}</span>`;
  $('ig').href = C.instagram;
  $('lista').innerHTML = sessions.map(sessHTML).join('');
  $('tabs').innerHTML = sessions.map(s=>`<button class="tab" role="tab" id="tab-${s}" data-s="${s}" aria-controls="sessao-${s.toLowerCase()}"><span>Sessão ${s}</span><small>${C.sessoes[s].ini}</small></button>`).join('');
  const by={}; DATA.rows.filter(perf).forEach(r=>{(by[r.prof]=by[r.prof]||new Set()).add(r.instr)});
  $('prof').innerHTML = C.banda.map(b=>`<li>${esc(b.n)}<span>${esc(b.i||[...(by[b.n]||[])].join(', '))}</span></li>`).join('');
  select(sessions.includes(selected)?selected:initial(),false);
}
function select(s,scroll){
  selected=s;
  sessions.forEach(x=>{ $('sessao-'+x.toLowerCase()).hidden = x!==s; $('tab-'+x).setAttribute('aria-selected', x===s); });
  $('tab-'+s).scrollIntoView({inline:'center',block:'nearest'});
  try{ history.replaceState(null,'','#'+s) }catch(e){}
  if(scroll){ const t=$('tabs'); window.scrollTo({top:Math.max(0,t.getBoundingClientRect().top+scrollY),behavior:'smooth'}); }
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab'); if(b) select(b.dataset.s,true)});
function initial(){
  const C=DATA.cfg, h=(location.hash||'').slice(1).toUpperCase(); if(sessions.includes(h)) return h;
  const [d,m,y]=C.data.split('/').map(Number), now=new Date();
  if(now.getFullYear()===y && now.getMonth()+1===m && now.getDate()===d){
    let cur=sessions[0]; sessions.forEach(s=>{const [hh,mm]=C.sessoes[s].ini.split(':').map(Number); if(now.getHours()*60+now.getMinutes()>=hh*60+mm-20) cur=s;}); return cur;
  }
  return sessions[0];
}
render();
async function refresh(){ const n=await syncNow(DATA,'both'); if(n){ DATA=n; render(); } }
refresh(); setInterval(refresh,300000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refresh() });
</script>
